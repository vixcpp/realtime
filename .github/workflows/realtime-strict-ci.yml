          echo "- Chat example smoke test"
          echo "- Reconnection and snapshot fallback smoke test"
          echo "- Static analysis"
          echo "- Valgrind memory checks"
          echo "- PostgreSQL store compile coverage"
          echo "- Package metadata and CMake contract checks"
